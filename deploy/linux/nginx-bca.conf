# Optional reverse proxy for LAN exposure of Big Cycle Atlas (native, no Docker).
# Install: sudo cp nginx-bca.conf /etc/nginx/sites-available/bca && sudo ln -s ../sites-available/bca /etc/nginx/sites-enabled/
# Terminate your own auth (e.g. client certs, Authelia) here — BCA has none.
server {
    listen 80;
    server_name bca.local;  # adjust

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
