# Big Cycle Atlas — production web server.
# Serves the Astro static build and proxies /api to the api service.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets: long cache (Astro fingerprints built assets)
    location /_astro/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }

    # SPA-style page fallback (Astro emits per-route index.html files,
    # but deep links should still resolve)
    location / {
        try_files $uri $uri/index.html $uri.html /index.html;
    }
}
